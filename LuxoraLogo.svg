<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Premium Gold Gradient matching your app's theme -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B" />
      <stop offset="50%" stop-color="#C69320" />
      <stop offset="100%" stop-color="#8A6112" />
    </linearGradient>
    
    <!-- Subtle drop shadow for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background (Optional: Can be removed for transparency) -->
  <rect width="100%" height="100%" fill="#111111" />

  <!-- The Geometric 'L' Diamond Monogram -->
  <g transform="translate(400, 220)" filter="url(#glow)">
    <!-- Outer Diamond Frame -->
    <path d="M 0 -100 L 100 0 L 0 100 L -100 0 Z" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="4" 
          stroke-miterlimit="10"/>
          
    <!-- Inner Abstract 'L' Shape -->
    <path d="M -30 -40 L -30 40 L 40 40" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="12" 
          stroke-linecap="square"
          stroke-linejoin="miter"/>
  </g>

  <!-- LUXORA Typography -->
  <text x="400" y="440" 
        font-family="-apple-system, BlinkMacSystemFont, 'Didot', 'Times New Roman', serif" 
        font-size="64" 
        font-weight="300" 
        letter-spacing="24" 
        fill="url(#goldGradient)" 
        text-anchor="middle">
    LUXORA
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="490" 
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" 
        font-size="14" 
        font-weight="400" 
        letter-spacing="8" 
        fill="#888888" 
        text-anchor="middle">
    RETAIL MANAGEMENT
  </text>
</svg>
